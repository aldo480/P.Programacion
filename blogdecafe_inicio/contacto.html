<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/normalice.css">
    <link rel="stylesheet" href="css/styles.css">
    <title>Cafe</title>
</head>
<body>
    <header class="header">

        <div class="contenedor">

            <div class="barra">

                <a class="logo" href="index.html">
                    <h1 class="logo__nombre no-margin text-center">Blog<span class="logo__bold">DeCafé</span></h1>
                </a>

                <nav class="navegacion">
                    <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>
                    <a href="cursos.html" class="navegacion__enlace">Cursos</a>
                    <a href="contacto.html" class="navegacion__enlace">Contacto</a>
                </nav>

            </div>

        </div>

        <div class="header__texto">

            <h2 class="no-margin">blog de cafe y cursos</h2>
            <p class="no-margin">aprende de los expertos con los mejores consejos</p>

        </div>

    </header>

    <main class="contenedor">
        <h3 class="text-center">nuestros cursos</h3>
       <div class="contacto__bg"></div>
       <form action="" class="formulario">
        <div class="campo">
            <label for="nombre" class="campo__label">Nombre</label>
            <input type="text" id="nombre" placeholder="tu nombre" class="campo__field">
        </div>
        <div class="campo">
            <label for="gmail" class="campo__label">gmail</label>
            <input type="email" id="gmail" placeholder="tu gmail" class="campo__field">
        </div>
        <div class="campo">
            <label for="mensaje" class="campo__label">mensaje</label>
            <textarea type="text" id="mensaje" placeholder="tu gmail" class="campo__field campo__field--textarea"></textarea>
        </div>
        <div>
            <input type="submit" value="enviar" class="boton boton__primario">
        </div>
       </form>
    </main>

    <footer class="footer no-margin ">
        <div class="contenedor">

            <div class="barra">

                <a class="logo" href="index.html">
                    <h1 class="logo__nombre no-margin text-center">Blog<span class="logo__bold">DeCafé</span></h1>
                </a>

                <nav class="navegacion">
                    <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>
                    <a href="cursos.html" class="navegacion__enlace">Cursos</a>
                    <a href="contacto.html" class="navegacion__enlace">Contacto</a>
                </nav>

            </div>

        </div>
    </footer>
</body>
</html>
